name: One-use reconcile PR76 with current main
on:
  push:
    branches: [codex/v15.7-five-doc-assurance-20260916]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor == 'ankitdcx'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v15.7-five-doc-assurance-20260916
          fetch-depth: 0
      - name: Reconcile current main deterministically
        run: |
          set -euo pipefail
          git config user.name 'ankitdcx'
          git config user.email '328232957+ankitdcx@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            printf 'Conflicts: %s\n' "${conflicts[*]}"
            expected=("design_deltas/v15.7/PENDING_CANDIDATE_INDEX.json" "reviews/v15.7/RELEASE-STATUS.md")
            [ "${#conflicts[@]}" -eq 2 ]
            [ "${conflicts[0]}" = "${expected[0]}" ]
            [ "${conflicts[1]}" = "${expected[1]}" ]
            git checkout --ours design_deltas/v15.7/PENDING_CANDIDATE_INDEX.json
            python - <<'PY'
          import subprocess
          from pathlib import Path
          path='reviews/v15.7/RELEASE-STATUS.md'
          ours=subprocess.check_output(['git','show','HEAD:'+path],text=True)
          main=subprocess.check_output(['git','show','origin/main:'+path],text=True)
          marker='## 2026-09-16 chat-derived candidate amendment set'
          if marker not in main:
              raise SystemExit('required main amendment section missing')
          tail=main[main.index(marker):].strip()
          if marker in ours:
              ours=ours[:ours.index(marker)].rstrip()
          composed=(ours.rstrip()+'\n\n'+tail+'\n')
          Path(path).write_text(composed)
          PY
            git add design_deltas/v15.7/PENDING_CANDIDATE_INDEX.json reviews/v15.7/RELEASE-STATUS.md
            git commit -m 'Reconcile PR76 with current main and retain chat amendments'
          fi
          git rm .github/workflows/one-use-sync-pr76-main.yml
          git commit -m 'Remove one-use PR76 reconciliation workflow'
          git push origin HEAD:codex/v15.7-five-doc-assurance-20260916
