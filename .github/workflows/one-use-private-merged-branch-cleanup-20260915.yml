name: One-use private merged branch cleanup 2026-09-15

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/one-use-private-merged-branch-cleanup-20260915.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete only exact-head merged private branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SELF_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          repo = os.environ['REPO']
          owner = os.environ['OWNER']
          token = os.environ['GH_TOKEN']
          self_branch = os.environ['SELF_BRANCH']
          api = f'https://api.github.com/repos/{repo}'
          candidates = [
              'ip/private-patent-register-20260914',
              'privacy/remove-originator-email-20260914',
          ]

          def request_json(url):
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))

          def delete_ref(branch):
              encoded = urllib.parse.quote(f'heads/{branch}', safe='')
              req = urllib.request.Request(
                  f'{api}/git/refs/{encoded}', method='DELETE', headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
              with urllib.request.urlopen(req, timeout=30) as r:
                  if r.status not in (200, 204):
                      raise RuntimeError(f'delete {branch}: HTTP {r.status}')

          deleted, retained = [], []
          for branch in candidates:
              try:
                  b = request_json(f"{api}/branches/{urllib.parse.quote(branch, safe='')}")
              except Exception as exc:
                  retained.append({'branch': branch, 'reason': 'MISSING_OR_UNREADABLE', 'detail': repr(exc)})
                  continue
              head_sha = b['commit']['sha']
              q = urllib.parse.urlencode({'state':'all','head':f'{owner}:{branch}','per_page':100})
              prs = request_json(f'{api}/pulls?{q}')
              if any(p.get('state') == 'open' for p in prs):
                  retained.append({'branch': branch, 'reason': 'OPEN_PR', 'head_sha': head_sha})
                  continue
              matched = [p for p in prs if p.get('merged_at') and (p.get('head') or {}).get('sha') == head_sha]
              if not matched:
                  retained.append({'branch': branch, 'reason': 'NO_EXACT_HEAD_MERGED_PR', 'head_sha': head_sha})
                  continue
              delete_ref(branch)
              deleted.append({'branch': branch, 'head_sha': head_sha, 'reason': 'EXACT_HEAD_MERGED_PR', 'merged_prs': [p['number'] for p in matched]})

          receipt = {
              'schema': 'GardenOneUseBranchCleanupReceipt/v1',
              'repository': repo,
              'policy': 'delete only when current branch head exactly matches a merged PR head and no open PR exists',
              'deleted': deleted,
              'retained': retained,
          }
          with open('one-use-private-branch-cleanup-receipt.json', 'w', encoding='utf-8') as f:
              json.dump(receipt, f, indent=2, sort_keys=True)
          print(json.dumps(receipt, indent=2, sort_keys=True))

          if self_branch.startswith('maintenance/one-use-private-merged-branch-cleanup-'):
              try:
                  delete_ref(self_branch)
                  print('self_branch_deleted=', self_branch)
              except Exception as exc:
                  print('self_branch_delete_warning=', repr(exc))
          PY
      - name: Upload cleanup receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-use-private-branch-cleanup-receipt-${{ github.run_id }}
          path: one-use-private-branch-cleanup-receipt.json
          if-no-files-found: warn
          retention-days: 30
