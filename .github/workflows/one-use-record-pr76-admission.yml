name: One-use record PR76 human admission
on:
  push:
    branches: [governance/pr76-human-admission-20260916]
permissions:
  contents: write
jobs:
  record:
    if: github.actor == 'ankitdcx'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/pr76-human-admission-20260916
          fetch-depth: 0
      - name: Build exact trusted-base admission
        env:
          BASE_EXPECTED: 46516375cf0c0db387c6c2fc665282409da7278a
          HEAD_EXPECTED: 60f437361107b13cd54aa36fbb345e8496bdeca3
        run: |
          set -euo pipefail
          git config user.name 'ankitdcx'
          git config user.email '328232957+ankitdcx@users.noreply.github.com'
          git fetch origin main codex/v15.7-five-doc-assurance-20260916
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          repo='ankitdcx/garden-main'
          pr=76
          base=os.environ['BASE_EXPECTED']
          head=os.environ['HEAD_EXPECTED']
          admission_path='governance/human_admissions/PR-76.json'

          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()

          if git('rev-parse','origin/main^{commit}') != base:
              raise SystemExit('main moved; regenerate admission against fresh base')
          if git('rev-parse','origin/codex/v15.7-five-doc-assurance-20260916^{commit}') != head:
              raise SystemExit('PR76 head moved; regenerate admission against fresh head')
          subprocess.run(['git','merge-base','--is-ancestor',base,head],check=True)

          tree=git('ls-tree','-r','-z',base)
          bound=sorted(x for x in tree.split('\0') if x and x.split('\t',1)[1] != admission_path)
          baseline=hashlib.sha256('\0'.join(bound).encode()).hexdigest()

          raw=git('diff','--raw','--no-abbrev','--no-renames','-z',base,head)
          parts=raw.split('\0')
          changes={}
          for i in range(0,len(parts)-1,2):
              if not parts[i]:
                  continue
              before_mode,after_mode,before,after,_status=parts[i].split()
              path=parts[i+1]
              changes[hashlib.sha256(path.encode()).hexdigest()]={
                  'before': None if set(before)=={'0'} else before,
                  'after': None if set(after)=={'0'} else after,
                  'before_mode': before_mode.lstrip(':'),
                  'after_mode': after_mode,
              }

          action_hashes={}
          paths=[x for x in git('ls-tree','-r','--name-only',head,'reviews/evolution/production').splitlines() if x.endswith('.json')]
          if not paths:
              raise SystemExit('no production action records in candidate')
          for path in paths:
              req=json.loads(git('show',head+':'+path))
              action=req.get('action',{})
              action_id=action.get('action_id')
              if not isinstance(action_id,str) or not action_id:
                  raise SystemExit('invalid action id in '+path)
              digest=hashlib.sha256(json.dumps(req,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
              prev=action_hashes.setdefault(action_id,digest)
              if prev != digest:
                  raise SystemExit('duplicate action id with different payload: '+action_id)

          record={
              'schema':'GardenBasePinnedHumanAdmission/v1',
              'receipt_id':'HUMAN-ADMISSION-PR76-2026-09-16',
              'decision':'HUMAN_ADMITTED',
              'kind':'HUMAN_SIGNOFF',
              'repository':repo,
              'pull_request':pr,
              'design_epoch':'v15.5',
              'canonical_source_root_sha256':'63561ce9fcd4a72f44af333662b342fd18c4e99930209c30c5f801bcc5c74598',
              'expires_at':'2026-09-23T23:59:59Z',
              'attestor_ref':'agent:codex:human-instruction-recorder',
              'observed_human_instruction':{
                  'channel':'Current authenticated user conversation',
                  'preceding_request':'How do I record it and where?',
                  'human_reply':'I approve PR #76 for merge as a noncanonical v15.7 candidate',
                  'followup_instruction':'Ok do it. And delete old branch.',
                  'scope':'Merge PR #76 as a noncanonical v15.7 candidate only; preserve canonical Garden v15.5; no canonical promotion, deployment authority, standing delegation, or waiver of unrelated failing checks.',
                  'recording_boundary':'Agent record of an observed user instruction; not a human digital signature, independent review, or cryptographic proof of identity.'
              },
              'process_authority':'governance/GardenCanonicalUpdateProcess_v1.4.json#human_root_authority',
              'canonical_promotion':False,
              'independent_review':False,
              'approved_base_sha':base,
              'approved_head_sha':head,
              'base_tree_without_admission':baseline,
              'change_path_encoding':'SHA256_UTF8',
              'changes':changes,
              'action_request_sha256':action_hashes,
          }
          out=Path(admission_path)
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(record,indent=2,sort_keys=False)+'\n')
          print(json.dumps({'record':admission_path,'changes':len(changes),'actions':len(action_hashes),'base':base,'head':head}))
          PY
          git add governance/human_admissions/PR-76.json
          git rm .github/workflows/one-use-record-pr76-admission.yml
          git commit -m 'Record human admission for PR76 noncanonical v15.7 candidate'
          git push origin HEAD:governance/pr76-human-admission-20260916
