name: One-use delete all non-main branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-use-delete-all-nonmain-20261116.yml'
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every remaining non-main branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const carrier = 'chatgpt/one-use-delete-all-nonmain-20261116';
            const token = process.env.GITHUB_TOKEN;
            const branches = await github.paginate(github.rest.repos.listBranches, {owner, repo, per_page: 100});
            const deleted = [];
            for (const b of branches) {
              if (b.name === 'main' || b.name === carrier) continue;
              const url = 'https://api.github.com/repos/' + owner + '/' + repo + '/git/refs/heads/' + b.name;
              const response = await fetch(url, {
                method: 'DELETE',
                headers: {
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              });
              if (!response.ok && response.status !== 404) {
                throw new Error('Failed deleting ' + b.name + ': ' + response.status + ' ' + await response.text());
              }
              deleted.push({name: b.name, sha: b.commit.sha, status: response.status});
            }
            const carrierUrl = 'https://api.github.com/repos/' + owner + '/' + repo + '/git/refs/heads/' + carrier;
            const carrierResponse = await fetch(carrierUrl, {
              method: 'DELETE',
              headers: {'Authorization':'Bearer ' + token, 'Accept':'application/vnd.github+json'}
            });
            if (!carrierResponse.ok && carrierResponse.status !== 404) throw new Error('Carrier deletion failed: ' + carrierResponse.status);
            const file = await github.rest.repos.getContent({owner, repo, path:'.github/workflows/one-use-delete-all-nonmain-20261116.yml', ref:'main'});
            await github.rest.repos.deleteFile({
              owner, repo,
              path:'.github/workflows/one-use-delete-all-nonmain-20261116.yml',
              message:'Remove one-use branch cleanup workflow',
              sha:file.data.sha,
              branch:'main'
            });
            core.info('Deleted remaining non-main branches: ' + deleted.length);
