name: One-use delete final leftover branch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-use-delete-all-nonmain-20261116.yml'
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the final non-main branch
        env:
          GH_TOKEN: ${{ github.token }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'docs/remove-git-history-commentary';
            const token = process.env.GH_TOKEN;
            const url = 'https://api.github.com/repos/' + owner + '/' + repo + '/git/refs/heads/' + branch;
            const response = await fetch(url, {
              method: 'DELETE',
              headers: {'Authorization':'Bearer ' + token, 'Accept':'application/vnd.github+json'}
            });
            if (!response.ok && response.status !== 404) throw new Error('Branch deletion failed: ' + response.status + ' ' + await response.text());
            core.info('Final non-main branch deleted: ' + branch);
