name: One-use delete all non-main branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-use-delete-all-nonmain-20261116.yml'
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            const targets = branches.filter(({ name }) => name !== 'main');
            core.info(`Found ${targets.length} non-main branches.`);
            for (const { name } of targets) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${name}`
                });
                core.info(`Deleted: ${name}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Already absent: ${name}`);
                } else {
                  throw new Error(`Could not delete ${name}: ${error.message}`);
                }
              }
            }
            const remaining = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            const unexpected = remaining.map(({ name }) => name).filter(name => name !== 'main');
            if (unexpected.length) {
              throw new Error(`Non-main branches remain: ${unexpected.join(', ')}`);
            }
            core.info('Verified: main is the only remaining branch.');
