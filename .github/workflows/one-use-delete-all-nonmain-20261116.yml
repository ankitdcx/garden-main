name: One-use final branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-use-delete-all-nonmain-20261116.yml'
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary cleanup branches
        env:
          GH_TOKEN: ${{ github.token }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branches = [
              'chatgpt/delete-final-leftover-branch-20261116',
              'chatgpt/cleanup-final-runner-20261116'
            ];
            const token = process.env.GH_TOKEN;
            for (const branch of branches) {
              const url = 'https://api.github.com/repos/' + owner + '/' + repo + '/git/refs/heads/' + branch;
              const response = await fetch(url, {
                method: 'DELETE',
                headers: {'Authorization':'Bearer ' + token, 'Accept':'application/vnd.github+json'}
              });
              if (!response.ok && response.status !== 404) throw new Error('Branch deletion failed for ' + branch + ': ' + response.status + ' ' + await response.text());
              core.info('Deleted or already absent: ' + branch);
            }
