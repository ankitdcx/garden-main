name: Garden private kernel CI

on:
  push:
    paths:
      - 'implementation/**'
      - 'scripts/gate_hourly_evolution.py'
      - 'scripts/audit_function_contract_coverage.py'
      - 'scripts/audit_evolution_reasoning.py'
      - 'scripts/audit_evolution_algebra.py'
      - 'reviews/evolution/**'
      - 'governance/**'
      - 'gsl/FUNCTION_CONTRACTS.json'
      - 'gsl/EVOLUTION_ALGEBRA_PROFILE.json'
      - '.github/workflows/kernel-ci.yml'
  pull_request:
    paths:
      - 'implementation/**'
      - 'scripts/gate_hourly_evolution.py'
      - 'scripts/audit_function_contract_coverage.py'
      - 'scripts/audit_evolution_reasoning.py'
      - 'scripts/audit_evolution_algebra.py'
      - 'reviews/evolution/**'
      - 'governance/**'
      - 'gsl/FUNCTION_CONTRACTS.json'
      - 'gsl/EVOLUTION_ALGEBRA_PROFILE.json'
      - '.github/workflows/kernel-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp-001-009-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile reference kernel
        run: python -m compileall -q implementation/garden_kernel
      - name: Run deterministic reference tests
        env:
          PYTHONPATH: implementation
        run: python -m unittest discover -s implementation/tests -v
      - name: Audit FunctionContract declaration coverage
        run: |
          mkdir -p /tmp/wp009-conformance
          python scripts/audit_function_contract_coverage.py \
            --output /tmp/wp009-conformance/function-contract-coverage.json
      - name: Audit changed production reasoning receipts
        run: |
          mkdir -p /tmp/wp009-conformance
          python scripts/audit_evolution_reasoning.py \
            --output /tmp/wp009-conformance/evolution-reasoning-conformance.json
      - name: Audit changed production algebra receipts
        run: |
          mkdir -p /tmp/wp009-conformance
          python scripts/audit_evolution_algebra.py \
            --output /tmp/wp009-conformance/evolution-algebra-conformance.json
      - name: Gate every production hourly evolution action
        run: |
          set -euo pipefail
          mkdir -p /tmp/wp007-production-gate-receipts
          count=0
          for input in reviews/evolution/production/*.json; do
            [ -e "$input" ] || continue
            count=$((count + 1))
            base="$(basename "$input" .json)"
            python scripts/gate_hourly_evolution.py \
              --input "$input" \
              --output "/tmp/wp007-production-gate-receipts/${base}.receipt.json"
          done
          test "$count" -gt 0
      - name: Upload immutable WP-007 production gate receipts
        uses: actions/upload-artifact@v4
        with:
          name: wp007-production-gate-${{ github.run_id }}
          path: /tmp/wp007-production-gate-receipts/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload WP-009 conformance evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp009-conformance-${{ github.run_id }}
          path: /tmp/wp009-conformance/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary reminder
        run: echo 'Reference tests and declaration/reasoning/algebra conformance PASS != Garden certification, semantic proof, authorization, canonical promotion, or deployment permission; FRONTIER is non-compliance and ActionGate remains the admission owner.'
