name: Garden private kernel CI

on:
  push:
    paths:
      - 'implementation/**'
      - '.github/workflows/kernel-ci.yml'
  pull_request:
    paths:
      - 'implementation/**'
      - '.github/workflows/kernel-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp-001-004-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile reference kernel
        run: python -m compileall -q implementation/garden_kernel
      - name: Run deterministic reference tests
        env:
          PYTHONPATH: implementation
        run: python -m unittest discover -s implementation/tests -v
      - name: Boundary reminder
        run: echo 'Reference tests PASS != Garden certification or deployment permission.'
