name: Garden private kernel CI

on:
  push:
    paths:
      - 'implementation/**'
      - 'scripts/gate_hourly_evolution.py'
      - 'scripts/audit_function_contract_coverage.py'
      - 'scripts/audit_evolution_reasoning.py'
      - 'scripts/audit_evolution_algebra.py'
      - 'scripts/audit_evolution_assurance.py'
      - 'scripts/audit_duplicate_semantics.py'
      - 'scripts/build_evolution_audit_chain.py'
      - 'scripts/validate_design_review_bundle.py'
      - 'reviews/evolution/**'
      - 'governance/**'
      - 'gsl/FUNCTION_CONTRACTS.json'
      - 'gsl/EVOLUTION_ALGEBRA_PROFILE.json'
      - 'gsl/EVOLUTION_AAP_PROFILE.json'
      - 'gsl/SHARED_CONFORMANCE_VECTORS.json'
      - 'work_packages/**'
      - '.github/workflows/kernel-ci.yml'
  pull_request:
    paths:
      - 'implementation/**'
      - 'scripts/gate_hourly_evolution.py'
      - 'scripts/audit_function_contract_coverage.py'
      - 'scripts/audit_evolution_reasoning.py'
      - 'scripts/audit_evolution_algebra.py'
      - 'scripts/audit_evolution_assurance.py'
      - 'scripts/audit_duplicate_semantics.py'
      - 'scripts/build_evolution_audit_chain.py'
      - 'scripts/validate_design_review_bundle.py'
      - 'reviews/evolution/**'
      - 'governance/**'
      - 'gsl/FUNCTION_CONTRACTS.json'
      - 'gsl/EVOLUTION_ALGEBRA_PROFILE.json'
      - 'gsl/EVOLUTION_AAP_PROFILE.json'
      - 'gsl/SHARED_CONFORMANCE_VECTORS.json'
      - 'work_packages/**'
      - '.github/workflows/kernel-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp-001-009-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check out public Garden reference
        uses: actions/checkout@v4
        with:
          repository: ankitdcx/garden-swarm
          ref: main
          path: .external/garden-swarm
          persist-credentials: false
      - name: Resolve complete governed change base
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            base="origin/${GITHUB_BASE_REF}"
          elif [ "${GITHUB_REF_NAME:-main}" != "main" ]; then
            base="origin/main"
          else
            base="HEAD^"
          fi
          git rev-parse --verify "$base" >/dev/null
          echo "GARDEN_CHANGE_BASE_REF=$base" >> "$GITHUB_ENV"
          echo "GARDEN_CHANGE_BASE_REF=$base"
      - name: Compile reference kernel
        run: python -m compileall -q implementation/garden_kernel
      - name: Run deterministic reference tests
        env:
          PYTHONPATH: implementation
        run: python -m unittest discover -s implementation/tests -v
      - name: Audit FunctionContract declaration coverage
        id: function_contracts
        continue-on-error: true
        run: |
          mkdir -p /tmp/wp009-conformance
          python scripts/audit_function_contract_coverage.py \
            --output /tmp/wp009-conformance/function-contract-coverage.json
      - name: Audit changed production reasoning receipts
        id: reasoning
        continue-on-error: true
        run: |
          mkdir -p /tmp/wp009-conformance
          python scripts/audit_evolution_reasoning.py \
            --base-ref "$GARDEN_CHANGE_BASE_REF" \
            --output /tmp/wp009-conformance/evolution-reasoning-conformance.json
      - name: Audit changed production algebra receipts
        id: algebra
        continue-on-error: true
        run: |
          mkdir -p /tmp/wp009-conformance
          python scripts/audit_evolution_algebra.py \
            --base-ref "$GARDEN_CHANGE_BASE_REF" \
            --output /tmp/wp009-conformance/evolution-algebra-conformance.json
      - name: Audit changed production AAP receipts
        id: assurance
        continue-on-error: true
        run: |
          mkdir -p /tmp/wp009-conformance
          python scripts/audit_evolution_assurance.py \
            --base-ref "$GARDEN_CHANGE_BASE_REF" \
            --output /tmp/wp009-conformance/evolution-aap-conformance.json
      - name: Audit duplicate semantics against public prototype
        id: duplicate_semantics
        continue-on-error: true
        run: |
          mkdir -p /tmp/wp009-conformance
          python scripts/audit_duplicate_semantics.py \
            --public-root .external/garden-swarm \
            --output /tmp/wp009-conformance/duplicate-semantics-conformance.json
      - name: Gate every production hourly evolution action
        id: production_gate
        if: steps.function_contracts.outcome == 'success' && steps.reasoning.outcome == 'success' && steps.algebra.outcome == 'success' && steps.assurance.outcome == 'success' && steps.duplicate_semantics.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p /tmp/wp007-production-gate-receipts
          count=0
          failed=0
          for input in reviews/evolution/production/*.json; do
            [ -e "$input" ] || continue
            count=$((count + 1))
            base="$(basename "$input" .json)"
            python scripts/gate_hourly_evolution.py \
              --base-ref "$GARDEN_CHANGE_BASE_REF" \
              --input "$input" \
              --output "/tmp/wp007-production-gate-receipts/${base}.receipt.json" || failed=1
          done
          test "$count" -gt 0 || failed=1
          exit "$failed"
      - name: Build WP-009 durable audit chain
        id: durable_audit
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/wp009-durable-audit
          python scripts/build_evolution_audit_chain.py \
            --chain-id "garden-main-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --record reviews/evolution/production \
            --record reviews/evolution/reasoning \
            --record reviews/evolution/algebra \
            --record reviews/evolution/assurance \
            --record /tmp/wp009-conformance \
            --record /tmp/wp007-production-gate-receipts \
            --output /tmp/wp009-durable-audit/evolution-audit-chain.json
      - name: Upload immutable WP-007 production gate receipts
        if: always() && steps.production_gate.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: wp007-production-gate-${{ github.run_id }}
          path: /tmp/wp007-production-gate-receipts/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload WP-009 conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp009-conformance-${{ github.run_id }}
          path: /tmp/wp009-conformance/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload WP-009 durable audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp009-durable-audit-${{ github.run_id }}
          path: /tmp/wp009-durable-audit/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce durable audit after receipt persistence
        if: always() && steps.durable_audit.outcome == 'failure'
        run: |
          echo 'WP-009 durable audit chain could not be constructed or verified; available receipts were uploaded before this fail-closed step.'
          exit 1
      - name: Enforce conformance before ActionGate admission
        if: always() && (steps.function_contracts.outcome == 'failure' || steps.reasoning.outcome == 'failure' || steps.algebra.outcome == 'failure' || steps.assurance.outcome == 'failure' || steps.duplicate_semantics.outcome == 'failure')
        run: |
          echo 'WP-009 conformance blocked ActionGate admission; conformance receipts were persisted.'
          exit 1
      - name: Enforce production gate after receipt persistence
        if: steps.production_gate.outcome == 'failure'
        run: |
          echo 'Production ActionGate blocked one or more actions; receipts and durable audit evidence were persisted before this fail-closed step.'
          exit 1
      - name: Boundary reminder
        run: echo 'Reference tests and declaration/reasoning/algebra/AAP/audit/duplicate-semantics conformance PASS != Garden certification, semantic proof, authorization, canonical promotion, permanent archival, or deployment permission; FRONTIER is non-compliance, SCEP convergence remains FRONTIER, and ActionGate remains the admission owner.'
