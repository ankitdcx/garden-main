name: One-use final branch prune
on:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: write
jobs:
  prune:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete all non-main branches after cleanup PR merge
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            for (const { name } of branches) {
              if (name === 'main') continue;
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${name}`
                });
                core.info(`Deleted: ${name}`);
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info(`Already absent: ${name}`);
              }
            }
            const remaining = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            const unexpected = remaining.map(({ name }) => name).filter(name => name !== 'main');
            if (unexpected.length) throw new Error(`Remaining branches: ${unexpected.join(', ')}`);
            core.info('Verified main is the only branch.');
