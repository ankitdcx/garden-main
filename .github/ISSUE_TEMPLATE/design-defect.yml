name: Design defect
description: Report a contradiction, omission, broken reference or other concrete defect.
title: "[Design defect]: "
body:
  - type: markdown
    attributes:
      value: |
        Report a defect in existing material. Distinguish a demonstrated defect from a suspected gap or an unresolved question.
  - type: input
    id: source_baseline
    attributes:
      label: Source baseline
      description: State the exact release, source root or commit.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Affected location
      description: File path and heading, stable anchor or identifier.
    validations:
      required: true
  - type: dropdown
    id: defect_type
    attributes:
      label: Defect type
      options:
        - Contradiction
        - Ambiguity
        - Missing obligation
        - Broken reference
        - Incorrect source or provenance
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Defect description
      description: Explain the issue and why it is a defect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction or counterexample
      description: Provide steps, examples or a counterexample where possible.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and impact
      description: Cite the relevant source material and explain affected obligations or dependent material.
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: Confidence
      options:
        - Confirmed from source
        - Strongly suspected
        - Unclear / needs review
    validations:
      required: true
