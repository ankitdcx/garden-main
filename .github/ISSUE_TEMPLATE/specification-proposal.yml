name: Specification proposal
description: Propose a bounded change or addition to the Garden design.
title: "[Proposal]: "
body:
  - type: markdown
    attributes:
      value: |
        A proposal is noncanonical unless separately reviewed and admitted. Read CONTRIBUTING.md first.
  - type: input
    id: source_baseline
    attributes:
      label: Source baseline
      description: State the exact Garden version, source root or commit.
      placeholder: Garden v15.5 / GSL v45.1
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Affected source locations
      description: Give file paths, headings, stable anchors or identifiers.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: State one bounded proposal and its intended effect.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale and alternatives
      description: Explain the problem, why the proposal helps, and alternatives considered.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and dependencies
      description: Identify affected objects, relations, rules, values, contracts, interfaces and dependent material.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and validation
      description: Include source evidence, counterexamples, tests and unresolved obligations.
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Current status
      options:
        - Hypothesis
        - Candidate proposal
        - Clarification needed
        - Supported by source evidence
        - Unknown / unresolved
    validations:
      required: true
